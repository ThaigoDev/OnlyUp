<!DOCTYPE html>
<html lang="en">

<head>
    <title>O Escalador - three.js</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <link type="text/css" rel="stylesheet" href="main.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
</head>

<body>

    <div id="crosshair" style="display: none;"></div>
    <div id="playerHand" style="display: none;"></div>

    <div id="mobileControls" style="display: none;">
        <div id="joystickContainer"></div>
        <div id="lookContainer"></div>
    </div>

    <div id="blocker" class="menu-active">

        <div id="menuBackground"></div>

        <div id="instructions">
            <div class="logo-container">
                <h1 class="game-title">Only Up</h1>
                <h2 class="game-subtitle">Minecraft Edition</h2>
            </div>

            <div class="menu-controls">
                <p>PC: WASD | Jump: SPACE | Look: MOUSE</p>
                <p>MOBILE: Joystick (Mover) | Look Area (Visão)</p>
            </div>

            <input type="text" id="playerNameInput" placeholder="Digite seu nome" maxlength="15">

            <div class="button-group">
                <button id="playButton" class="primary-btn">JOGAR</button>
                <button id="playButtonFree">Modo Livre</button>
                <button id="DificultButton">Dificuldade: <span id="difficultyText">FÁCIL</span></button>
                <button id="rankingButton">Ranking</button>
            </div>
            <a href="./creditos.html"><button id="creditsBtn" class="corner-btn">Créditos</button></a>
        </div>

        <div id="pauseScreen" style="display: none;">
            <p style="font-size:36px">Jogo Pausado</p>
            <button id="resumeButton">Continuar</button>
            <button id="TelaDeInicioButton">Voltar ao Menu</button>
        </div>

        <div id="gameOverScreen" style="display: none;">
            <h2 id="gameOverMessage" style="font-size:36px;">Game Over</h2>
            <p id="gameOverScore" style="font-size: 24px;"></p>
            <button id="restartButton">Tentar Novamente</button>
            <button id="TelaDeInicioButtonGO">Voltar ao Menu</button>
        </div>
    </div>

    <div id="scoreContainer" class="game-hud" style="display: none;">
        Pontuação: <span id="scoreValue">0</span>m
    </div>

    <div id="timerContainer" class="game-hud" style="display: none;">
        Tempo: <span id="timerValue">05:00</span>
    </div>

    <div id="rankingOverlay">
        <div id="rankingBox">
            <h2>Melhores Pontuações</h2>
            <ol id="rankingList"></ol>
            <button id="resetRankingButton">Resetar</button>
            <button id="closeRanking">Fechar</button>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                /* 🚨 Verifique se este caminho está correto em relação à sua pasta 'build' */
                "three": "../build/three.module.js",
                "three/addons/": "./jsm/"
            }
        }
    </script>
    <script type="module" src="main.js"></script>
</body>
</html>
